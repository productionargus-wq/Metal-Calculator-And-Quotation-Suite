name: Build Mobile Apps (Android & iOS)

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Target Mobile Platform to Build'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - android
          - ios

jobs:
  build-android:
    name: Build Android (APK & AAB)
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.platform == 'all' || github.event.inputs.platform == 'android' }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'mobile-app/package-lock.json'

      - name: Install Mobile Dependencies & Prepare Assets
        run: |
          cd mobile-app
          npm ci || npm install
          npm run prepare-mobile

      - name: Grant Execute Permission to Gradle Wrapper
        run: |
          chmod +x mobile-app/android/gradlew

      - name: Generate CI Signing Keystore
        run: |
          keytool -genkey -v -keystore mobile-app/android/app/release.keystore \
            -alias metalcalc -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=MetalCalculator, OU=Argus, O=ArgusTechnologies, L=Chennai, ST=TN, C=IN"

      - name: Compile Standalone Release APK (.apk)
        run: |
          cd mobile-app/android
          ./gradlew assembleRelease

      - name: Compile Google Play Store App Bundle (.aab)
        run: |
          cd mobile-app/android
          ./gradlew bundleRelease

      - name: Upload Standalone Android APK (.apk)
        uses: actions/upload-artifact@v4
        with:
          name: android-release-apk
          path: mobile-app/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload Google Play Store App Bundle (.aab)
        uses: actions/upload-artifact@v4
        with:
          name: android-release-aab
          path: mobile-app/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

  build-ios:
    name: Build iOS (XCArchive & IPA)
    runs-on: macos-latest
    if: ${{ github.event.inputs.platform == 'all' || github.event.inputs.platform == 'ios' }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Mobile Dependencies & Prepare Assets
        run: |
          cd mobile-app
          npm ci || npm install
          npm run prepare-mobile

      - name: Install CocoaPods Dependencies
        run: |
          cd mobile-app/ios/App
          pod install

      - name: Build Xcode Archive (App.xcarchive)
        run: |
          cd mobile-app/ios/App
          xcodebuild archive \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/App.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package Unsigned iOS Package (.ipa)
        run: |
          cd mobile-app/ios/App
          mkdir -p build/Payload
          cp -r build/App.xcarchive/Products/Applications/App.app build/Payload/
          cd build
          zip -r MetalCalculator-unsigned.ipa Payload

      - name: Upload iOS Xcode Archive (.xcarchive)
        uses: actions/upload-artifact@v4
        with:
          name: ios-app-xcarchive
          path: mobile-app/ios/App/build/App.xcarchive
          if-no-files-found: error

      - name: Upload iOS Package (.ipa)
        uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned-ipa
          path: mobile-app/ios/App/build/MetalCalculator-unsigned.ipa
          if-no-files-found: error
