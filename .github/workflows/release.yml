name: Publish GitHub Release (Cross-Platform)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag Name (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Binaries (.exe & Setup)
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node Dependencies
        run: |
          npm ci || npm install

      - name: Prepare Windows Environment Config
        shell: powershell
        run: |
          if (-not (Test-Path .env)) {
            @"
          MONGODB_URI=mongodb+srv://salesargustech_db_user:12345@cluster0.nrulvqr.mongodb.net/?appName=Cluster0
          PORT=3000
          GOOGLE_CLIENT_ID=626458680124-0qlrhuebi0n3ooe53kvet29hp8nj264u.apps.googleusercontent.com
          "@ | Out-File -FilePath .env -Encoding utf8
          }

      - name: Build Standalone Windows Executable (.exe)
        shell: powershell
        run: |
          node build_standalone_exe.js

      - name: Compile Windows Setup Wizard Installer with Inno Setup
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.2
        with:
          path: installer.iss

      - name: Stage Windows Release Files
        shell: powershell
        run: |
          mkdir release_assets -Force
          Copy-Item "dist_executable\MetalCalculator.exe" -Destination "release_assets\MetalCalculator-Standalone-Windows.exe"
          if (Test-Path "dist\MetalCalculator_Setup.exe") {
            Copy-Item "dist\MetalCalculator_Setup.exe" -Destination "release_assets\MetalCalculator-Setup-Windows.exe"
          }

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-assets
          path: release_assets/*

  build-macos:
    name: Build macOS DMG & App (.dmg)
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Node Dependencies & Bundle Backend
        run: |
          npm ci || npm install
          npx esbuild server.js --bundle --platform=node --target=node20 --outfile=backend_bundle.js

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python Desktop Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pywebview pyinstaller pyobjc-framework-Cocoa pyobjc-framework-WebKit

      - name: Prepare macOS Environment Config
        run: |
          if [ ! -f .env ]; then
            cat << 'EOF' > .env
          MONGODB_URI=mongodb+srv://salesargustech_db_user:12345@cluster0.nrulvqr.mongodb.net/?appName=Cluster0
          PORT=3000
          GOOGLE_CLIENT_ID=626458680124-0qlrhuebi0n3ooe53kvet29hp8nj264u.apps.googleusercontent.com
          EOF
          fi

      - name: Build Native macOS Application (.app) with PyInstaller
        run: |
          pyinstaller --clean -y desktop_app.spec

      - name: Package macOS Disk Image Installer (.dmg)
        run: |
          mkdir -p release_assets
          hdiutil create -volname "MetalCalculator" -srcfolder "dist/MetalCalculator.app" -ov -format UDZO "release_assets/MetalCalculator-macOS.dmg"
          cd dist
          zip -r ../release_assets/MetalCalculator-macOS.app.zip MetalCalculator.app

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-release-assets
          path: release_assets/*

  build-android:
    name: Build Android Release APK (.apk)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'mobile-app/package-lock.json'

      - name: Install Mobile Dependencies & Prepare Assets
        run: |
          cd mobile-app
          npm ci || npm install
          npm run prepare-mobile

      - name: Grant Execute Permission to Gradle Wrapper
        run: |
          chmod +x mobile-app/android/gradlew

      - name: Generate CI Signing Keystore
        run: |
          keytool -genkey -v -keystore mobile-app/android/app/release.keystore \
            -alias metalcalc -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=MetalCalculator, OU=Argus, O=ArgusTechnologies, L=Chennai, ST=TN, C=IN"

      - name: Compile Standalone Release APK (.apk)
        run: |
          cd mobile-app/android
          ./gradlew assembleRelease

      - name: Stage Android Release Files
        run: |
          mkdir -p release_assets
          cp mobile-app/android/app/build/outputs/apk/release/*.apk release_assets/MetalCalculator-Android-Release.apk

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-release-assets
          path: release_assets/*

  publish-release:
    name: Publish Official GitHub Release
    needs: [build-windows, build-macos, build-android]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download All Release Assets
        uses: actions/download-artifact@v4
        with:
          path: all_release_assets
          merge-multiple: true

      - name: Determine Release Tag
        id: tag_info
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release and Upload Binaries
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag_info.outputs.tag }}
          name: "Argus Metal Weight Calculator & Quotation Suite ${{ steps.tag_info.outputs.tag }}"
          body: |
            ## Argus Quotation Suite & Metal Calculator Official Release
            
            ### Included Packages:
            - **Windows Standalone Executable:** `MetalCalculator-Standalone-Windows.exe` (Zero setup, portable single-file)
            - **Windows Setup Wizard:** `MetalCalculator-Setup-Windows.exe` (Standard Windows installation wizard with desktop shortcut)
            - **macOS Disk Image:** `MetalCalculator-macOS.dmg` (Universal Apple installer for macOS)
            - **macOS App Bundle:** `MetalCalculator-macOS.app.zip` (Portable Mac `.app`)
            - **Android Standalone APK:** `MetalCalculator-Android-Release.apk` (Direct installable Android package)
            
            ### Key Features & Updates:
            - **Pre-warmed MongoDB Atlas Connection:** High-speed, cold-start resilient database handshake.
            - **Google OAuth Integration:** Pre-configured on Port 3000 to match authorized Google Cloud credentials.
            - **GSTIN & Pricing Multiplier Modules:** Live daily metal pricing, GSTIN enterprise lookup, and executive PDF generation.
          files: all_release_assets/*
          draft: false
          prerelease: false
